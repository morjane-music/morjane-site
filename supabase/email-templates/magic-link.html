<div style="font-family:Inter,Arial,sans-serif;background:#090706;color:#f4efe7;padding:24px">
  <p style="color:#c99852;letter-spacing:.14em;text-transform:uppercase;margin:0 0 16px">
    Atelier Morjane
  </p>
  <h1 style="font-size:22px;line-height:1.25;margin:0 0 14px">
    Entre dans l'Atelier.
  </h1>
  <p style="color:#c8bcae;line-height:1.6;margin:0 0 18px">
    Ce lien ouvre ta session. S'il s'ouvre dans une fenetre mail, reviens dans ton navigateur et utilise le code ci-dessous.
  </p>
  <p style="margin:24px 0">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;border:1px solid #c99852;color:#f4efe7;text-decoration:none;padding:12px 16px;border-radius:999px">
      Entrer dans l'Atelier
    </a>
  </p>
  <p style="color:#9d9183;font-size:13px;line-height:1.6;margin:0 0 8px">
    Code de connexion
  </p>
  <p style="color:#f4efe7;font-size:24px;letter-spacing:.18em;margin:0 0 18px">
    {{ .Token }}
  </p>
  <p style="color:#9d9183;font-size:13px;line-height:1.6;margin:0">
    Ce lien et ce code sont personnels et expirent rapidement.
  </p>
</div>
